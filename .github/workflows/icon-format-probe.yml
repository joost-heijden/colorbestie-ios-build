name: Public App Store icon bitmap format probe
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.event.repository.private == false && github.repository == 'joost-heijden/colorbestie-ios-build' && github.actor == 'joost-heijden' }}
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - name: Inspect native sips bitmap dimensions for the approved public icon
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --max-time 30 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/4b/8f/cd/4b8fcd86-f627-2f68-85b3-bc7470972efb/AppIcon-1x_U007epad-0-1-85-220-0.png/1024x1024bb.png' -o icon.png
          shasum -a 256 icon.png
          sips -s format bmp icon.png --out icon.bmp >/dev/null
          python3 <<'PY'
          import json, pathlib, struct
          data = pathlib.Path('icon.bmp').read_bytes()
          width, height, planes, bits = struct.unpack_from('<iiHH', data, 18)
          print(json.dumps({'width': width, 'signedHeight': height, 'planes': planes, 'bits': bits, 'oldDimensionCheck': (width,height)==(1024,1024), 'absoluteDimensionCheck': (width,abs(height))==(1024,1024)}))
          assert width == 1024 and abs(height) == 1024 and planes == 1
          PY
